name: Sync wallet

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python scripts/sync.py
      - name: Commit changes
        run: |
          # meta.json changes every run; only commit when the Axies or cards changed
          if git diff --quiet -- data/axies.json data/cards.json img cards && [ -z "$(git ls-files --others --exclude-standard img cards)" ]; then
            echo "No wallet changes."
            exit 0
          fi
          git config user.name "axie-sync-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/axies.json data/cards.json data/meta.json img cards
          git commit -m "Sync wallet"
          git pull --rebase
          git push
